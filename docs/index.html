<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@primer/css@22.3.0/dist/primer.css">
<link rel="stylesheet" href="book/css/variables-8adf115d.css">
<style>
body.color-bg-default { background: var(--bg) !important; color: var(--fg); }
body .color-bg-subtle { background: var(--sidebar-bg) !important; }
.Box, .btn { border-color: var(--sidebar-spacer); }
a { color: var(--links); }
.btn { background: var(--theme-popup-bg); color: var(--fg); }
.btn-primary { background: var(--fg); color: var(--bg); }
.btn:hover { background: var(--theme-hover); color: var(--fg); }
body .color-fg-muted { color: var(--fg) !important; }
body { min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
.site-width { width: min(100% - 48px, 72rem); margin-inline: auto; }
.site-header, .site-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-block: 12px; }
.site-header a, .site-footer a { display: inline-flex; align-items: center; min-height: 44px; }
.site-main { display: grid; align-items: center; padding-block: 24px; }
.site-hero { padding: clamp(24px, 6vw, 76px); }
.site-hero h1 { font-size: clamp(1.9rem, 4vw, 3.4rem); line-height: 1.2; text-wrap: balance; }
.site-hero p { font-size: clamp(1rem, 1.5vw, 1.2rem); line-height: 1.65; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.actions .btn { display: inline-flex; min-height: 48px; justify-content: center; align-items: center; gap: 8px; }
@media (max-width: 600px) {
  .site-width { width: calc(100% - 32px); }
  .site-header, .site-footer { padding-block: 4px; }
  .site-main { align-items: start; padding-block: 16px 24px; }
  .site-hero { padding: 24px 20px; }
  .actions { display: grid; grid-template-columns: minmax(0, 1fr); }
}
</style>
<script>
const fallbackTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'navy' : 'light';
let theme = fallbackTheme;
try { theme = localStorage.getItem('mdbook-theme')?.replaceAll('"', '') || fallbackTheme; } catch {}
document.documentElement.className = ['light', 'rust', 'coal', 'navy', 'ayu'].includes(theme) ? theme : fallbackTheme;
</script>
</head>

<main class="site-width site-main">

</section>
</main>
<footer><div class="site-width site-footer"><span>黑背雪整理</span><a href="https://github.com/konghenfuxue-cpu/viral-posts-archive/issues">补档与纠错 ↗</a></div></footer>
